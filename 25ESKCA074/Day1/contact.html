<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <p>
        <form>
            <h2>CONTACT NOW: </h2>
            <p>Name: <input type="text" name="name" id="name" required placeholder="Enter your name"></p>
            <p>Email: <input type="email" name="mail" id="mail" required placeholder="Enter mail id"></p>
            <p>Phone: <input type="number" name="phone" id="phone" required placeholder="Enter phone number"></p>
            <p>Address: <input type="text" name="add" id="add" required placeholder="Enter address"></p>
            <p>Pincode: <input type="password" name="pin" id="pin" required placeholder="Enter pincode"></p>
            <p>Message: <textarea name="msg" id="msg" cols="50" rows="10" placeholder="Enter your message"></textarea> </p>
            <input type="button" value="Clear">
            <input type="button" value="Submit">
        </form>
    </p>

</body>
</html>
